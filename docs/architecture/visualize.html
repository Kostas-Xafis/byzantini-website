<style>
	:root {
		--bg: #0b1220;
		--panel: #101a30;
		--panel2: #16233f;
		--line: #24365c;
		--text: #dbe6f7;
		--muted: #8fa3c8;
		--accent: #5eead4;
		--accent2: #93c5fd;
		--amber: #fcd34d;

	* { box-sizing: border-box; }
	html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif; }
	header { padding: 18px 22px 12px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #0e1830, var(--bg)); }
	header h1 { margin: 0; font-size: 19px; letter-spacing: .3px; }
	header h1 .dot { color: var(--accent); }
	header p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
	nav { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
	nav button {
		white-space: nowrap; background: transparent; color: var(--muted); border: 1px solid transparent;
		padding: 5px 11px; border-radius: 999px; cursor: pointer; font-size: 12.5px;
	}
	nav button:hover { color: var(--text); border-color: var(--line); }
	nav button.active { background: #1d3a5f; color: #fff; border-color: #2d5588; }
	main { padding: 20px 24px 60px; max-width: 1240px; margin: 0 auto; }
	section.tab { display: none; }
	section.tab.active { display: block; }
	h2 { font-size: 17px; margin: 6px 0 2px; }
	.caption { color: var(--muted); margin: 2px 0 14px; max-width: 900px; }
	.mount { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; overflow-x: auto; }

	.toolbar { display: flex; gap: 8px; margin: 4px 0 8px; }
	.toolbar button {
		background: var(--panel2); color: var(--muted); border: 1px solid var(--line); border-radius: 6px;
		padding: 3px 10px; cursor: pointer; font-size: 12px;
	}
	.toolbar button:hover { color: var(--text); border-color: var(--accent2); }
	pre.src { background: #0a0f1c; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; color: #b9d0f0; font: 12px/1.5 "Cascadia Code", Consolas, monospace; white-space: pre; display: none; max-height: 60vh; }
	pre.src.open { display: block; }
	table { border-collapse: collapse; font-size: 12.8px; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 8px 0 16px; }
	th { background: var(--panel2); color: #cfe0f8; text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line); font-weight: 600; }
	td { padding: 5px 9px; border-bottom: 1px solid #1a2745; vertical-align: top; color: var(--text); }
	tr:last-child td { border-bottom: none; }
	code.inl { background: #1a2b4f; border-radius: 4px; padding: 0 5px; font-size: 12px; color: #a9d8ff; }
	ul.facts { max-width: 950px; }
	.k { color: var(--amber); font-weight: 600; }
	.note { border-left: 3px solid var(--amber); background: #1c2408; padding: 8px 12px; border-radius: 0 6px 6px 0; color: #f5e9c4; margin: 10px 0; max-width: 950px; }

	<h2>What this is</h2>
	<p class="caption" style="font-size:13.5px">
	A full-stack <b>music-school platform</b> (public website + admin panel, Greek UI) for the Byzantine
	music school of Metamorfosi. The frontend is <b>Astro 7 + SolidJS islands + Tailwind 4</b>, deployed as a
	<code class="inl">@astrojs/cloudflare</code> Worker (<b>byzantini-website</b>). It has its own typed HTTP API
	(Isokratis-style <code class="inl">APIServer</code> route instances behind one catch-all route), a <b>Cloudflare D1</b>
	database, <b>R2</b> storage behind a <code class="inl">Bucket</code> abstraction, the <b>Cloudflare Images</b> binding for
	announcement thumbnails, and two separate Cloudflare Workers as aux services: a <b>PDF generator</b>
	(<code class="inl">byzantini-website-pdf-gen</code>) and the <b>email stack</b>
	(<code class="inl">byzantini-website-emails</code>), which replaced retired Docker/Cloud Run services.
	</p>

/* ===================== REQUEST LIFECYCLE ===================== */
{
	const t = tab("lifecycle", "Request lifecycle");
	t.body = {
		caption: `How a browser action reaches D1 / R2 / aux workers — one API catch-all, in-process dispatch server-side, real fetch client-side.`,
		diagram: `sequenceDiagram
  autonumber
  actor B as Browser (Solid island)
  participant A as Astro page (SSR)
  participant API as src/pages/api/[...slug].ts
  participant R as APIServer registry (lib/api/routes)
  participant M as authenticateMiddleware
  participant H as Route handler
  participant DB as D1 (via lib/utils.server)
  participant S as R2 / Images / PDF / Email

  Note over A,R: Server-side useAPI dispatches IN-PROCESS (no self-fetch, error 1042 fix)
  B->>A: page request
  A->>R: useAPI("Group.key", payload) in-process
  R->>M: authenticate (session cookie)
  M-->>R: session_id
  R->>H: handler(payload, session)
  H->>DB: executeQuery / executeTransaction
  DB-->>H: rows
  H-->>R: handlerResult data
  R-->>A: { data | message | error }
  A-->>B: HTML / JSON

  Note over B,R: Browser islands fetch the same endpoints over HTTP
  B->>API: fetch POST /api/Group.key
  API->>R: APIServer.handle(request, "/api")
  R-->>API: typed envelope + status
  API-->>B: JSON

  Note over H,S: Side-effects: R2 uploads, Images thumbnails,<br/>PDF worker call, email worker call
  H-->>S: Bucket / lib/images / lib/pdf.client / emails
  S-->>H: ok`

/* ================================================================== *
 *  RENDERER
 * ================================================================== */
const order = TABS.map(t => t.id);
const panes = document.getElementById("panes");
const navEl = document.getElementById("tabs");

for (const t of TABS) {
	const btn = document.createElement("button");
	btn.textContent = t.title;
	btn.dataset.tab = t.id;
	navEl.appendChild(btn);
	const sec = document.createElement("section");
	sec.className = "tab";
	sec.dataset.pane = t.id;
	if (typeof t.body === "string") {
		sec.innerHTML = t.body;
	} else {
		const h = document.createElement("h2");
		h.textContent = t.title;
		sec.appendChild(h);
		const cap = document.createElement("p");
		cap.className = "caption";
		cap.innerHTML = t.body.caption || "";
		sec.appendChild(cap);
		const bar = document.createElement("div");
		bar.className = "toolbar";
		const view = document.createElement("button");
		view.textContent = "Toggle mermaid source";
		const copy = document.createElement("button");
		copy.textContent = "Copy mermaid source";
		bar.appendChild(view); bar.appendChild(copy);
		sec.appendChild(bar);
		const mount = document.createElement("div");
		mount.className = "mount";
		mount.dataset.mount = t.id;
		mount.innerHTML = '<div class="caption" style="margin:0">rendering…</div>';
		sec.appendChild(mount);
		const pre = document.createElement("pre");
		pre.className = "src";
		pre.textContent = t.body.diagram;
		sec.appendChild(pre);
		view.addEventListener("click", () => pre.classList.toggle("open"));
		copy.addEventListener("click", () => {
			navigator.clipboard && navigator.clipboard.writeText(t.body.diagram);
			copy.textContent = "Copied ✓";
			setTimeout(() => (copy.textContent = "Copy mermaid source"), 1200);
		});
		sec.dataset.ready = "0";
	}
	panes.appendChild(sec);
}

let mermaidReady = false;
const mermaidScript = document.querySelector('script[src*="mermaid"]');
function bootMermaid() {
	mermaidReady = true;
	mermaid.initialize({
		startOnLoad: false,
		theme: "dark",
		themeVariables: { darkMode: true, background: "#101a30", primaryColor: "#16233f", primaryTextColor: "#dbe6f7", primaryBorderColor: "#2d5588", lineColor: "#5b7bb0", secondaryColor: "#123f33", tertiaryColor: "#40310f", fontFamily: "Segoe UI, system-ui" },
		flowchart: { curve: "basis", htmlLabels: true },
		securityLevel: "loose",
	});
}
if (window.mermaid) bootMermaid();
else mermaidScript.addEventListener("load", bootMermaid);

let active = null;
async function activate(id) {
	if (active === id) return;
	active = id;
	navEl.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.tab === id));
	panes.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.dataset.pane === id));
	const sec = panes.querySelector(`section[data-pane="${id}"]`);
	if (!sec || sec.dataset.ready === "1") return;
	const t = TABS.find(x => x.id === id);
	if (typeof t.body === "string" || typeof t.body.diagram !== "string") return;
	sec.dataset.ready = "1";
	const mount = sec.querySelector(".mount");
	if (mermaidReady) {
		try {
			const { svg } = await mermaid.render("mmd-" + id, t.body.diagram);
			mount.innerHTML = svg;
		} catch (e) {
			mount.innerHTML = `<div class="note">Mermaid failed to render this diagram: ${String(e)}</div>`;
		}
	} else {
		mount.innerHTML = `<div class="note">Mermaid CDN not reachable — see “Toggle mermaid source” below for the raw diagram.</div>`;
	}
}
navEl.querySelectorAll("button").forEach(b => b.addEventListener("click", () => activate(b.dataset.tab)));
activate(order[0]);
</script>
